<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Liquidity Hunter AI Pro</title><style>body{margin:0;background:#070b16;color:#eaf0ff;font:14px system-ui}header{padding:18px 16px;border-bottom:1px solid #20283d;position:sticky;top:0;background:#070b16cc;backdrop-filter:blur(8px);z-index:2}h1{margin:0;font-size:24px}small,.muted{color:#8f9bb7}.wrap{display:flex;min-height:calc(100vh - 70px)}nav{width:190px;padding:12px;border-right:1px solid #20283d}nav button{display:block;width:100%;text-align:left;background:transparent;color:#aeb9d2;border:0;padding:12px;border-radius:9px;margin:3px 0}nav button.active,nav button:hover{background:#151d31;color:#fff}.content{flex:1;padding:16px;max-width:1100px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}input,select,button.action{background:#11192b;color:#fff;border:1px solid #2a3652;border-radius:8px;padding:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:14px 0}.card{background:#0e1525;border:1px solid #202b43;border-radius:12px;padding:14px}.value{font-size:22px;font-weight:750;margin-top:5px}.panel{background:#0e1525;border:1px solid #202b43;border-radius:12px;padding:14px;margin-top:12px}.row{display:flex;justify-content:space-between;border-bottom:1px solid #202b43;padding:10px 0}.pill{padding:4px 8px;border-radius:99px;background:#182238}.signal{font-size:28px;font-weight:800}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #202b43}th{color:#8f9bb7;font-size:12px}.warn{color:#ffd166}@media(max-width:700px){nav{width:130px}.content{padding:10px}nav button{font-size:12px}}</style></head><body><header><h1>LIQUIDITY HUNTER <span class="muted">AI PRO</span></h1><small>Multi-factor crypto research terminal · Paper/Research mode</small></header><div class="wrap"><nav id="nav"></nav><section class="content"><div class="toolbar"><input id="symbol" value="BTCUSDT" placeholder="Symbol"><select id="tf"><option>1m</option><option selected>5m</option><option>15m</option><option>1h</option><option>4h</option></select><button class="action" onclick="loadCoin()">Analyze</button><button class="action" onclick="scan()">Scan Market</button><span id="status" class="muted">Ready</span></div><div id="view"></div></section></div><script>const menus=[['overview','Overview'],['coins','Coin Scanner'],['whale','Whale Flow'],['ema','EMA Strategy'],['macd','MACD'],['rsi','RSI'],['pump','Pump Detector'],['smc','SMC / ICT'],['risk','Risk Engine'],['backtest','Backtest']];const nav=document.getElementById('nav'),view=document.getElementById('view');menus.forEach((m,i)=>{let b=document.createElement('button');b.textContent=m[1];b.onclick=()=>show(m[0],b);if(i===0)b.className='active';nav.appendChild(b)});function show(id,b){document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b?.classList.add('active');if(id==='overview'||id==='coins')return loadCoin();if(id==='whale')return module('Whale Flow','Order-book imbalance, bid/ask pressure and liquidity concentration. This module is a proxy for visible market liquidity; it is not a claim of identifying individual whales.','Provider order-book adapter');if(id==='ema')return module('EMA Strategy','EMA 20 / 50 trend alignment + VWAP location + structure confirmation.','Trend module');if(id==='macd')return module('MACD','MACD line, signal line and histogram confirmation should be combined with structure, not used alone.','Momentum module');if(id==='rsi')return module('RSI','RSI regime, divergence and overbought/oversold context.','Momentum module');if(id==='pump')return module('Pump Detector','Price expansion + relative volume + range breakout + liquidity/structure checks.','Research alert module');if(id==='smc')return module('SMC / ICT','Liquidity sweep → displacement → MSS/CHOCH → FVG retest model.','Structure module');if(id==='risk')return module('Risk Engine','ATR-based stop distance, R-multiple targets and position-sizing research.','Risk module');if(id==='backtest')return module('Backtest','Fees + slippage + walk-forward validation, win rate, profit factor, expectancy and drawdown.','Validation module')}function module(t,d,s){view.innerHTML=`<div class="panel"><h2>${t}</h2><p class="muted">${d}</p><div class="row"><span>Status</span><b>${s}</b></div><div class="row"><span>Mode</span><b>RESEARCH ONLY</b></div></div>`}async function loadCoin(){let sym=document.getElementById('symbol').value.toUpperCase().trim(),tf=document.getElementById('tf').value;status.textContent='Analyzing...';try{let r=await fetch('/v3/coin/'+encodeURIComponent(sym)+'?interval='+tf+'&limit=300');let d=await r.json();if(!r.ok)throw Error(d.detail||d.error||'API error');let s=d.signal,m=s.market||{},st=s.structure||{},risk=s.risk_example||{};view.innerHTML=`<div class="grid"><div class="card">Decision<div class="signal">${s.decision}</div></div><div class="card">Confidence<div class="value">${s.confidence}/100</div></div><div class="card">Long Score<div class="value">${s.long_score}</div></div><div class="card">Short Score<div class="value">${s.short_score}</div></div></div><div class="panel"><h3>Market Factors</h3><div class="grid"><div class="card">Close<div class="value">${fmt(m.close)}</div></div><div class="card">EMA 20<div class="value">${fmt(m.ema20)}</div></div><div class="card">EMA 50<div class="value">${fmt(m.ema50)}</div></div><div class="card">VWAP<div class="value">${fmt(m.vwap)}</div></div><div class="card">Relative Volume<div class="value">${fmt(m.rvol)}</div></div></div></div><div class="panel"><h3>Structure / Liquidity</h3>${Object.entries(st).map(([k,v])=>`<div class="row"><span>${k.replaceAll('_',' ')}</span><b>${v?'YES':'NO'}</b></div>`).join('')}</div><div class="panel"><h3>Risk Example</h3><div class="row"><span>Entry</span><b>${fmt(risk.entry)}</b></div><div class="row"><span>Stop</span><b>${risk.stop==null?'—':fmt(risk.stop)}</b></div><div class="row"><span>Target 1</span><b>${risk.target_1==null?'—':fmt(risk.target_1)}</b></div><div class="row"><span>Target 2</span><b>${risk.target_2==null?'—':fmt(risk.target_2)}</b></div></div><div class="panel"><h3>Decision Reasons</h3><pre style="white-space:pre-wrap;color:#aeb9d2">${JSON.stringify(s.reasons,null,2)}</pre></div><p class="warn">Research signal only. Do not treat confidence as a guaranteed probability of profit.</p>`;status.textContent='Done'}catch(e){status.textContent='Error';view.innerHTML=`<div class="panel">${e.message}</div>`}}async function scan(){status.textContent='Scanning...';try{let r=await fetch('/scan?interval='+document.getElementById('tf').value+'&limit=30');let d=await r.json();view.innerHTML='<div class="panel"><h2>Market Scanner</h2><table><thead><tr><th>Coin</th><th>V3</th><th>Confidence</th><th>Legacy signal</th><th>Provider</th></tr></thead><tbody>'+((d.results||[]).map(x=>`<tr><td>${x.symbol}</td><td>${x.v3_decision||'—'}</td><td>${x.v3_confidence??'—'}</td><td>${x.best_signal||x.error||'—'}</td><td>${x.data_provider||'—'}</td></tr>`).join(''))+'</tbody></table></div>';status.textContent='Done'}catch(e){status.textContent='Error: '+e.message}}function fmt(x){return Number.isFinite(Number(x))?Number(x).toPrecision(8):'—'}loadCoin();</script></body></html>
